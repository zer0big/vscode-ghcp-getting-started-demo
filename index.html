<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="작업을 추가, 완료 표시, 삭제할 수 있는 작업 관리 앱입니다." />
    <title>작업 관리 앱</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
      }());
    </script>
  </head>
  <body>
    <div class="app-wrapper">
      <header class="app-header">
        <button id="theme-toggle" class="btn btn-theme-toggle" aria-label="다크 모드로 전환">
          <span class="icon-moon">
            <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
          <span class="icon-sun">
            <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
        </button>
        <h1>
          <svg aria-hidden="true" focusable="false" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
          작업 관리
        </h1>
        <p class="app-subtitle">오늘의 할 일을 관리하세요</p>
      </header>

      <main id="main-content">
        <!-- 작업 입력 폼 -->
        <section aria-labelledby="add-task-heading" class="add-task-section">
          <h2 id="add-task-heading" class="visually-hidden">새 작업 추가</h2>
          <form id="task-form" class="task-form" novalidate>
            <div class="input-group">
              <label for="task-input" class="visually-hidden">작업 내용</label>
              <input
                type="text"
                id="task-input"
                name="task"
                class="task-input"
                placeholder="새 작업을 입력하세요..."
                autocomplete="off"
                maxlength="200"
                aria-required="true"
                aria-describedby="input-hint"
              />
              <button type="submit" class="btn btn-add" aria-label="작업 추가">
                <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                추가
              </button>
            </div>
            <p id="input-hint" class="input-hint" role="status" aria-live="polite"></p>
          </form>
        </section>

        <!-- 요약 및 필터 -->
        <section aria-label="작업 요약 및 필터" class="summary-bar">
          <div class="task-stats" role="status" aria-live="polite" aria-atomic="true">
            <span id="stats-total" class="stat">
              <strong id="count-total">0</strong> 전체
            </span>
            <span class="stat-divider" aria-hidden="true">·</span>
            <span id="stats-active" class="stat stat--active">
              <strong id="count-active">0</strong> 진행 중
            </span>
            <span class="stat-divider" aria-hidden="true">·</span>
            <span id="stats-done" class="stat stat--done">
              <strong id="count-done">0</strong> 완료
            </span>
          </div>
          <div class="filter-group" role="group" aria-label="작업 필터">
            <button class="btn btn-filter active" data-filter="all" aria-pressed="true">전체</button>
            <button class="btn btn-filter" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="btn btn-filter" data-filter="completed" aria-pressed="false">완료</button>
          </div>
        </section>

        <!-- 작업 목록 -->
        <section aria-labelledby="task-list-heading" class="task-list-section">
          <h2 id="task-list-heading" class="visually-hidden">작업 목록</h2>
          <ul id="task-list" class="task-list" aria-label="작업 항목 목록">
            <!-- 작업 항목은 app.js에서 동적으로 렌더링됩니다 -->
          </ul>
          <div id="empty-state" class="empty-state" hidden>
            <svg aria-hidden="true" focusable="false" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10" />
              <path d="M8 12h8M12 8v8" />
            </svg>
            <p>표시할 작업이 없습니다.</p>
          </div>
        </section>

        <!-- 완료 항목 일괄 삭제 -->
        <footer class="task-footer">
          <button id="clear-completed-btn" class="btn btn-clear" hidden aria-label="완료된 작업 모두 삭제">
            완료 항목 삭제
          </button>
        </footer>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
